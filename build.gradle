
plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.minebridge'
version = '1.0.0'

repositories {
    mavenCentral()

    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.6-R0.1-SNAPSHOT'
    implementation 'net.dv8tion:JDA:5.6.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.spigotmc:spigot-api:1.20.6-R0.1-SNAPSHOT'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.jar {
    archiveBaseName = 'MineBridge'
}

tasks.shadowJar {
    archiveClassifier = ''
}

tasks.test {
    useJUnitPlatform()
}

tasks.build {
    dependsOn tasks.shadowJar
}

def nvdApiKey = providers.environmentVariable('NVD_API_KEY').orNull
def dependencyCheckKevEnabledValue = providers.gradleProperty('dependencyCheckKevEnabled').orNull
if (dependencyCheckKevEnabledValue != null
        && !dependencyCheckKevEnabledValue.equalsIgnoreCase('true')
        && !dependencyCheckKevEnabledValue.equalsIgnoreCase('false')) {
    throw new GradleException('dependencyCheckKevEnabled must be true or false')
}
def dependencyCheckKevEnabled = dependencyCheckKevEnabledValue == null
        || dependencyCheckKevEnabledValue.equalsIgnoreCase('true')

dependencyCheck {
    scanConfigurations = ['runtimeClasspath']
    formats = ['HTML', 'JSON']
    failBuildOnCVSS = 7.0
    outputDirectory = layout.buildDirectory.dir('reports/dependency-check')
    nvd {
        if (nvdApiKey != null && !nvdApiKey.isBlank()) {
            apiKey = nvdApiKey
        }
    }
    analyzers {
        kev {
            enabled = dependencyCheckKevEnabled
        }
    }
}
