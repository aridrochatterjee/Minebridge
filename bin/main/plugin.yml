name: MineBridge
version: 1.2.0
main: com.minebridge.MineBridgePlugin
api-version: '1.20'
description: Minecraft and Discord integration with chat relay and death notifications
author: Horizon

commands:
  minebridge:
    description: Manage the MineBridge Discord integration
    usage: /minebridge <help|status|server|players|reload>
    aliases: [mb]

permissions:
  minebridge.admin:
    description: Allows management of MineBridge
    default: op
